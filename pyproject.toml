[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polydoc"
version = "0.1.3"
description = "A universal, editable document model. Read, edit, and write PDF, DOCX, PPTX, XLSX, Markdown, HTML, and more through one API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Name only, deliberately: PyPI metadata is public and scraped, so the contact
# channel is the issue tracker rather than an email address.
authors = [{ name = "Ramakant Kaushik" }]
maintainers = [{ name = "Ramakant Kaushik" }]
keywords = [
    "document",
    "conversion",
    "pdf",
    "docx",
    "pptx",
    "xlsx",
    "markdown",
    "html",
    "editing",
    "document-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Core dependencies are pure Python, small, and compile-free, so `pip install polydoc`
# is fast everywhere and still genuinely useful: Markdown, HTML, text, JSON and CSV all
# work out of the box. Everything needing a C extension or a heavyweight backend is an
# extra.
dependencies = [
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Backends that are large or need compilation. polydoc degrades gracefully: a format is
# simply unavailable (with an actionable install hint) when its backend is absent.
pdf = ["pymupdf>=1.24", "pdfplumber>=0.11", "reportlab>=4.0"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=1.0"]
xlsx = ["openpyxl>=3.1"]
# lxml is optional even for HTML: BeautifulSoup falls back to the stdlib parser.
# Installing it makes HTML parsing faster and more tolerant of malformed markup.
html = ["lxml>=5.0"]
# Kept so `polydoc[markdown]` does not break for anyone who pinned it before Markdown
# became a core dependency.
markdown = []
all = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.0",
]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.6"]

[project.scripts]
polydoc = "polydoc.cli:main"

[project.urls]
Homepage = "https://github.com/ramakantkaus-sys/polydoc"
Documentation = "https://github.com/ramakantkaus-sys/polydoc#readme"
Repository = "https://github.com/ramakantkaus-sys/polydoc"
Issues = "https://github.com/ramakantkaus-sys/polydoc/issues"
Changelog = "https://github.com/ramakantkaus-sys/polydoc/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polydoc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

# The rule set is pinned explicitly rather than inherited from ruff's defaults, which
# change between releases and would make CI results depend on the runner's ruff version.
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", # line length: enforced by review, not mechanically
    "E741", # ambiguous names like `l`: not used here, and the check is noisy
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__ files exist precisely to expose names they do not use.
"src/polydoc/__init__.py" = ["F401"]
"src/polydoc/model/__init__.py" = ["F401"]
"src/polydoc/formats/__init__.py" = ["F401"]
"src/polydoc/edit/__init__.py" = ["F401"]
"src/polydoc/intelligence/__init__.py" = ["F401"]
# Tests import model types for readability even when only some are constructed.
"tests/*" = ["F401"]
